apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "skycast.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
